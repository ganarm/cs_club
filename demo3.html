<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBE - Computer United Bright Enthusiasts</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            perspective: 1000px;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 0, 0.05) 0%, transparent 50%);
            animation: backgroundPulse 4s ease-in-out infinite alternate;
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        .cube-container {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: rotateCube 8s linear infinite;
        }

        .cube {
            position: absolute;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            /* Enhanced cube face text with rainbow glow */
            background: linear-gradient(45deg, #ff0080, #ff8000, #ffff00, #80ff00, #00ff80, #0080ff, #8000ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 1);
            animation: gradientShift 3s ease-in-out infinite, pulseGlow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.8));
        }

        /* Added pulsing glow effect for cube faces */
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.8)); }
            100% { filter: drop-shadow(0 0 40px rgba(255, 0, 255, 1)); }
        }

        .face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Enhanced circuit pattern with rainbow effects */
            background: 
                linear-gradient(45deg, 
                    transparent 30%, 
                    rgba(255, 0, 128, 0.3) 40%,
                    rgba(255, 255, 0, 0.3) 50%, 
                    rgba(0, 255, 128, 0.3) 60%,
                    transparent 70%),
                radial-gradient(circle at center, 
                    rgba(0, 255, 255, 0.2) 0%, 
                    rgba(255, 0, 255, 0.2) 50%,
                    transparent 70%);
            animation: circuitPattern 3s ease-in-out infinite alternate, rainbowPulse 4s ease-in-out infinite;
        }

        /* Added rainbow pulse animation */
        @keyframes rainbowPulse {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        .front {
            /* Enhanced cube face backgrounds with more vibrant gradients */
            background: linear-gradient(135deg, #ff0080, #ff4080, #ff8080);
            transform: translateZ(150px);
            color: #fff;
            box-shadow: 0 0 50px rgba(255, 0, 128, 0.8);
        }

        .back {
            background: linear-gradient(135deg, #8000ff, #4080ff, #0080ff);
            transform: translateZ(-150px) rotateY(180deg);
            color: #fff;
            box-shadow: 0 0 50px rgba(128, 0, 255, 0.8);
        }

        .right {
            background: linear-gradient(135deg, #00ff80, #40ff80, #80ff80);
            transform: rotateY(90deg) translateZ(150px);
            color: #fff;
            box-shadow: 0 0 50px rgba(0, 255, 128, 0.8);
        }

        .left {
            background: linear-gradient(135deg, #ffff00, #ffff40, #ffff80);
            transform: rotateY(-90deg) translateZ(150px);
            color: #fff;
            box-shadow: 0 0 50px rgba(255, 255, 0, 0.8);
        }

        .top {
            background: linear-gradient(135deg, #ff8000, #ff8040, #ff8080);
            transform: rotateX(90deg) translateZ(150px);
            color: #fff;
            box-shadow: 0 0 50px rgba(255, 128, 0, 0.8);
        }

        .bottom {
            background: linear-gradient(135deg, #00ffff, #40ffff, #80ffff);
            transform: rotateX(-90deg) translateZ(150px);
            color: #fff;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
        }

        .binary-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .binary-column {
            position: absolute;
            top: -100px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            /* Enhanced rainbow binary streams with animated colors */
            background: linear-gradient(180deg, 
                #ff0080, #ff8000, #ffff00, #80ff00, 
                #00ff80, #0080ff, #8000ff, #ff0080);
            background-size: 100% 800%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: binaryFall 3s linear infinite, rainbowFlow 2s linear infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            opacity: 0.9;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.6));
        }

        /* Added rainbow animation for binary streams */
        @keyframes rainbowFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 0% 100%; }
        }

        .floating-icons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .icon {
            position: absolute;
            font-size: 30px;
            /* Enhanced floating icons with rainbow colors */
            background: linear-gradient(45deg, #ff0080, #ff8000, #ffff00, #80ff00, #00ff80, #0080ff, #8000ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            animation: floatIcon 4s ease-in-out infinite, gradientShift 3s ease-in-out infinite;
            opacity: 0;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.8));
        }

        .light-trails {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            margin: -200px 0 0 -200px;
            border-radius: 50%;
            /* Enhanced light trails with rainbow gradient */
            background: radial-gradient(circle, 
                transparent 30%, 
                rgba(255, 0, 128, 0.3) 40%,
                rgba(255, 128, 0, 0.3) 50%,
                rgba(255, 255, 0, 0.3) 60%,
                rgba(0, 255, 128, 0.3) 70%,
                rgba(0, 128, 255, 0.3) 80%,
                transparent 90%);
            animation: lightTrails 2s ease-in-out infinite alternate, rotateRainbow 8s linear infinite;
            z-index: 0;
        }

        /* Added rotating rainbow effect */
        @keyframes rotateRainbow {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.3); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            /* Enhanced particles with rainbow colors */
            background: linear-gradient(45deg, #ff0080, #ffff00, #00ff80, #0080ff);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            animation: particleFloat 6s linear infinite, particleRainbow 2s linear infinite;
        }

        /* Added rainbow animation for particles */
        @keyframes particleRainbow {
            0% { background: #ff0080; box-shadow: 0 0 15px #ff0080; }
            25% { background: #ffff00; box-shadow: 0 0 15px #ffff00; }
            50% { background: #00ff80; box-shadow: 0 0 15px #00ff80; }
            75% { background: #0080ff; box-shadow: 0 0 15px #0080ff; }
            100% { background: #ff0080; box-shadow: 0 0 15px #ff0080; }
        }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        @keyframes circuitPattern {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        @keyframes binaryFall {
            0% { 
                transform: translateY(-100px);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        @keyframes floatIcon {
            0%, 100% { 
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }
            50% { 
                opacity: 1;
                transform: translateY(-20px) scale(1.2);
            }
        }

        @keyframes lightTrails {
            0% { 
                transform: scale(1) rotate(0deg);
                opacity: 0.3;
            }
            100% { 
                transform: scale(1.2) rotate(180deg);
                opacity: 0.7;
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInLogo {
            0% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background"></div>
        <div class="grid"></div>
        
        <div class="particles" id="particles"></div>
        
        <div class="light-trails"></div>
        
        <div class="binary-stream" id="binaryStream"></div>
        
        <div class="floating-icons" id="floatingIcons"></div>
        
        <div class="cube-container" id="cubeContainer">
            <div class="cube">
                <div class="face front">AI</div>
                <div class="face back">CODE</div>
                <div class="face right">DATA</div>
                <div class="face left">TECH</div>
                <div class="face top">CUBE</div>
                <div class="face bottom">CS</div>
            </div>
        </div>
        
        <div class="logo-text" id="logoText">
            <h1>CUBE</h1>
            <p>Computer United Bright Enthusiasts</p>
            <div class="dept">Department of Computer Science</div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Create binary stream
            function createBinaryStream() {
                const stream = $('#binaryStream');
                const columns = Math.floor(window.innerWidth / 20);
                
                for (let i = 0; i < columns; i++) {
                    const column = $('<div class="binary-column"></div>');
                    let binaryText = '';
                    
                    for (let j = 0; j < 20; j++) {
                        binaryText += Math.random() > 0.5 ? '1' : '0';
                        if (j < 19) binaryText += '<br>';
                    }
                    
                    column.html(binaryText);
                    column.css({
                        left: i * 20 + 'px',
                        /* Added random animation delays and durations for more dynamic effect */
                        animationDelay: Math.random() * 3 + 's',
                        animationDuration: (Math.random() * 2 + 2) + 's, 2s'
                    });
                    
                    stream.append(column);
                }
            }

            // Create floating icons
            function createFloatingIcons() {
                /* Enhanced with more tech icons and emojis */
                const icons = ['🤖', '⚡', '💻', '🔬', '🌐', '⚙️', '🚀', '💡', '🔮', '⭐', '🎯', '🎨', '🎪', '🎭', '🎊', '🎉'];
                const container = $('#floatingIcons');
                
                icons.forEach((icon, index) => {
                    const iconElement = $('<div class="icon"></div>');
                    iconElement.text(icon);
                    iconElement.css({
                        top: Math.random() * 80 + 10 + '%',
                        left: Math.random() * 80 + 10 + '%',
                        animationDelay: index * 0.3 + 's',
                        /* Added random sizes for more variety */
                        fontSize: (Math.random() * 20 + 25) + 'px'
                    });
                    container.append(iconElement);
                });
            }

            // Create particles
            function createParticles() {
                const container = $('#particles');
                
                /* Increased particle count for more spectacular effect */
                for (let i = 0; i < 100; i++) {
                    const particle = $('<div class="particle"></div>');
                    particle.css({
                        left: Math.random() * 100 + '%',
                        animationDelay: Math.random() * 6 + 's',
                        animationDuration: (Math.random() * 4 + 4) + 's, 2s',
                        /* Added random particle sizes */
                        width: (Math.random() * 3 + 2) + 'px',
                        height: (Math.random() * 3 + 2) + 'px'
                    });
                    container.append(particle);
                }
            }

            // Initialize effects
            createBinaryStream();
            createFloatingIcons();
            createParticles();

            // Transform to logo after 10 seconds
            setTimeout(function() {
                $('#cubeContainer').fadeOut(2000);
                $('#binaryStream').fadeOut(1500);
                $('#floatingIcons').fadeOut(1500);
                
                setTimeout(function() {
                    $('#logoText').css('animation', 'fadeInLogo 3s ease-out forwards');
                }, 1000);
            }, 10000);

            // Add dynamic lighting effects
            setInterval(function() {
                $('.face').each(function() {
                    const randomOpacity = 0.7 + Math.random() * 0.3;
                    $(this).css('opacity', randomOpacity);
                });
            }, 200);

            // Add mouse interaction
            $(document).mousemove(function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                
                $('#cubeContainer').css('transform', 
                    `rotateX(${y}deg) rotateY(${x}deg) rotateZ(0deg)`
                );
            });

            // Refresh binary stream periodically
            setInterval(function() {
                $('.binary-column').each(function() {
                    let binaryText = '';
                    for (let j = 0; j < 20; j++) {
                        binaryText += Math.random() > 0.5 ? '1' : '0';
                        if (j < 19) binaryText += '<br>';
                    }
                    $(this).html(binaryText);
                    
                    /* Added random color shifts to binary columns */
                    const hue = Math.random() * 360;
                    $(this).css('filter', `hue-rotate(${hue}deg) drop-shadow(0 0 10px rgba(255, 255, 255, 0.6))`);
                });
            }, 800);

            /* Added dynamic rainbow background effect */
            setInterval(function() {
                const hue = Math.random() * 360;
                $('.background').css('filter', `hue-rotate(${hue}deg)`);
            }, 2000);
        });
    </script>
</body>
</html>
