<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBE - Computer United Bright Enthusiasts</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            perspective: 1000px;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 0, 0.05) 0%, transparent 50%);
            animation: backgroundPulse 4s ease-in-out infinite alternate;
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        .cube-container {
            position: relative;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
            animation: rotateCube 8s linear infinite;
        }

        .cube {
            position: absolute;
            width: 300px;
            height: 300px;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 20px currentColor;
        }

        .face::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%),
                radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: circuitPattern 3s ease-in-out infinite alternate;
        }

        .front {
            background: linear-gradient(135deg, #00ffff, #0080ff);
            transform: translateZ(150px);
            color: #fff;
        }

        .back {
            background: linear-gradient(135deg, #ff00ff, #8000ff);
            transform: translateZ(-150px) rotateY(180deg);
            color: #fff;
        }

        .right {
            background: linear-gradient(135deg, #00ff00, #80ff00);
            transform: rotateY(90deg) translateZ(150px);
            color: #fff;
        }

        .left {
            background: linear-gradient(135deg, #ffff00, #ff8000);
            transform: rotateY(-90deg) translateZ(150px);
            color: #fff;
        }

        .top {
            background: linear-gradient(135deg, #ff0000, #ff0080);
            transform: rotateX(90deg) translateZ(150px);
            color: #fff;
        }

        .bottom {
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            transform: rotateX(-90deg) translateZ(150px);
            color: #fff;
        }

        .binary-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .binary-column {
            position: absolute;
            top: -100px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
            animation: binaryFall 3s linear infinite;
            opacity: 0.7;
        }

        .floating-icons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .icon {
            position: absolute;
            font-size: 30px;
            color: #00ffff;
            text-shadow: 0 0 20px currentColor;
            animation: floatIcon 4s ease-in-out infinite;
            opacity: 0;
        }

        .light-trails {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            margin: -200px 0 0 -200px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 40%, rgba(0, 255, 255, 0.1) 70%, transparent 100%);
            animation: lightTrails 2s ease-in-out infinite alternate;
            z-index: 0;
        }

        .logo-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            opacity: 0;
            z-index: 10;
        }

        .logo-text h1 {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00, #00ff00);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }

        .logo-text p {
            font-size: 1.5rem;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 10px;
        }

        .logo-text .dept {
            font-size: 1.2rem;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }

        .founders-section {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            opacity: 0;
            z-index: 10;
            width: 80%;
            max-width: 800px;
        }

        .founders-section h1 {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #00ff00, #ffff00);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            margin-bottom: 40px;
        }

        .founders-list {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .founder-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin: 10px;
            width: 200px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            animation: cardGlow 2s ease-in-out infinite alternate;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.5s ease;
        }

        .founder-card:nth-child(1) {
            animation-delay: 0s;
        }

        .founder-card:nth-child(2) {
            animation-delay: 0.5s;
        }

        .founder-card:nth-child(3) {
            animation-delay: 1s;
        }

        .founder-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .founder-card h2 {
            font-size: 1.8rem;
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
            margin-bottom: 10px;
        }

        .founder-card p {
            font-size: 1.2rem;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        @keyframes cardGlow {
            0% {
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            }
            100% {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            }
        }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        @keyframes backgroundPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        @keyframes circuitPattern {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        @keyframes binaryFall {
            0% { 
                transform: translateY(-100px);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        @keyframes floatIcon {
            0%, 100% { 
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }
            50% { 
                opacity: 1;
                transform: translateY(-20px) scale(1.2);
            }
        }

        @keyframes lightTrails {
            0% { 
                transform: scale(1) rotate(0deg);
                opacity: 0.3;
            }
            100% { 
                transform: scale(1.2) rotate(180deg);
                opacity: 0.7;
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInLogo {
            0% { 
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% { 
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff;
            animation: particleFloat 6s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background"></div>
        <div class="grid"></div>
        
        <div class="particles" id="particles"></div>
        
        <div class="light-trails"></div>
        
        <div class="binary-stream" id="binaryStream"></div>
        
        <div class="floating-icons" id="floatingIcons"></div>
        
        <div class="cube-container" id="cubeContainer">
            <div class="cube">
                <div class="face front">AI</div>
                <div class="face back">CODE</div>
                <div class="face right">DATA</div>
                <div class="face left">TECH</div>
                <div class="face top">CUBE</div>
                <div class="face bottom">CS</div>
            </div>
        </div>
        
        <div class="logo-text" id="logoText">
            <h1>CUBE</h1>
            <p>Computer United Bright Enthusiasts</p>
            <div class="dept">Department of Computer Science</div>
        </div>

        <div class="founders-section" id="foundersText">
            <h1>Our Founders</h1>
            <div class="founders-list">
                <div class="founder-card">
                    <h2>Ganesh Mali</h2>
                    <p>Founder 1</p>
                </div>
                <div class="founder-card">
                    <h2>Yuvraj Sonwane</h2>
                    <p>Founder 2</p>
                </div>
                <div class="founder-card">
                    <h2>Arin Dhimar</h2>
                    <p>Founder 3</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Create binary stream
            function createBinaryStream() {
                const stream = $('#binaryStream');
                const columns = Math.floor(window.innerWidth / 20);
                
                for (let i = 0; i < columns; i++) {
                    const column = $('<div class="binary-column"></div>');
                    let binaryText = '';
                    
                    for (let j = 0; j < 20; j++) {
                        binaryText += Math.random() > 0.5 ? '1' : '0';
                        if (j < 19) binaryText += '<br>';
                    }
                    
                    column.html(binaryText);
                    column.css({
                        left: i * 20 + 'px',
                        animationDelay: Math.random() * 3 + 's'
                    });
                    
                    stream.append(column);
                }
            }

            // Create floating icons
            function createFloatingIcons() {
                const icons = ['🤖', '⚡', '💻', '🔬', '🌐', '⚙️', '🚀', '💡'];
                const container = $('#floatingIcons');
                
                icons.forEach((icon, index) => {
                    const iconElement = $('<div class="icon"></div>');
                    iconElement.text(icon);
                    iconElement.css({
                        top: Math.random() * 80 + 10 + '%',
                        left: Math.random() * 80 + 10 + '%',
                        animationDelay: index * 0.5 + 's'
                    });
                    container.append(iconElement);
                });
            }

            // Create particles
            function createParticles() {
                const container = $('#particles');
                
                for (let i = 0; i < 50; i++) {
                    const particle = $('<div class="particle"></div>');
                    particle.css({
                        left: Math.random() * 100 + '%',
                        animationDelay: Math.random() * 6 + 's',
                        animationDuration: (Math.random() * 4 + 4) + 's'
                    });
                    container.append(particle);
                }
            }

            // Initialize effects
            createBinaryStream();
            createFloatingIcons();
            createParticles();

            // Transform to logo after 10 seconds
            setTimeout(function() {
                $('#cubeContainer').fadeOut(2000);
                $('#binaryStream').fadeOut(1500);
                $('#floatingIcons').fadeOut(1500);
                
                setTimeout(function() {
                    $('#logoText').css('animation', 'fadeInLogo 3s ease-out forwards').one('animationend', function() {
                        setTimeout(function() {
                            $('#logoText').fadeOut(2000);
                            setTimeout(function() {
                                $('#foundersText').css('animation', 'fadeInLogo 3s ease-out forwards');
                                setTimeout(function() {
                                    $('.founder-card').each(function(index) {
                                        setTimeout(() => {
                                            $(this).addClass('visible');
                                        }, index * 500);
                                    });
                                }, 1000);
                            }, 2000);
                        }, 15000);
                    });
                }, 1000);
            }, 10000);

            // Add dynamic lighting effects
            setInterval(function() {
                $('.face').each(function() {
                    const randomOpacity = 0.7 + Math.random() * 0.3;
                    $(this).css('opacity', randomOpacity);
                });
            }, 200);

            // Add mouse interaction
            $(document).mousemove(function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                
                $('#cubeContainer').css('transform', 
                    `rotateX(${y}deg) rotateY(${x}deg) rotateZ(0deg)`
                );
            });

            // Refresh binary stream periodically
            setInterval(function() {
                $('.binary-column').each(function() {
                    let binaryText = '';
                    for (let j = 0; j < 20; j++) {
                        binaryText += Math.random() > 0.5 ? '1' : '0';
                        if (j < 19) binaryText += '<br>';
                    }
                    $(this).html(binaryText);
                });
            }, 1000);
        });
    </script>
</body>
</html>
